services:
  coffeeshop:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./logs:/app/logs
      - uploads:/app/uploads
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/mydb
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=pass
      # local demo values only; override them in a .env file
      - APP_ADMIN_PASSWORD=${APP_ADMIN_PASSWORD:-admin123}
      - APP_REMEMBER_ME_KEY=${APP_REMEMBER_ME_KEY:-local-demo-remember-me-key}
    depends_on:
      - db
    restart: on-failure

  db:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
  uploads:
