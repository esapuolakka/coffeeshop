spring.application.name=coffeeshop
spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:coffeeshop;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true

spring.thymeleaf.cache=false
spring.web.resources.cache.period=0
logging.file.name=logs/application.log
logging.level.root=DEBUG

# HTTP sessions are stored in the database (Spring Session JDBC) so the app can
# run on several instances behind a load balancer without sticky sessions.
spring.session.jdbc.initialize-schema=always
spring.session.jdbc.schema=classpath:session-schema.sql
spring.session.jdbc.table-name=SPRING_SESSION
server.servlet.session.timeout=30m


# Image storage: "local" (files in a directory, default for development) or "s3".
# For S3 set app.storage.type=s3 and app.storage.s3.bucket (region is optional, the
# AWS SDK falls back to AWS_REGION / instance metadata). Credentials come from the
# default AWS provider chain, i.e. the instance role when running on EC2.
app.storage.type=local
app.storage.local.dir=uploads
#app.storage.s3.bucket=
#app.storage.s3.region=

# Only the health endpoint is exposed (used by the Docker health check and deploy smoke test).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Pictures for the seeded products are copied to the image storage at startup
# (see util/SeedImageLoader). Set to false to skip.
app.seed-images.enabled=true

# Product images are limited to 1MB (also checked in AdminService). Stated explicitly
# so the limit does not depend on a framework default; a bigger file is answered
# with 413 and a message (see UploadExceptionHandler).
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=2MB
