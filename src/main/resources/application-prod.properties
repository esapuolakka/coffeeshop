# Production profile (docker compose, EC2/RDS): SPRING_PROFILES_ACTIVE=prod
#
# Everything environment-specific comes from environment variables. Secrets have
# no defaults on purpose: a misconfigured deployment fails at startup instead of
# silently running with development defaults (in-memory H2, admin/admin123, ...).

# --- database (PostgreSQL) ---
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
# data.sql is idempotent (ON CONFLICT DO NOTHING) and runs on every start
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# --- secrets ---
app.admin.password=${APP_ADMIN_PASSWORD}
app.security.remember-me-key=${APP_REMEMBER_ME_KEY}

# --- hardening ---
# The H2 console would let anyone with the URL connect to arbitrary JDBC URLs.
spring.h2.console.enabled=false
server.shutdown=graceful

# --- runtime behaviour ---
spring.thymeleaf.cache=true
spring.web.resources.cache.period=1h
logging.level.root=INFO
# log to the console only (docker logs / CloudWatch), not to a file in the container
logging.file.name=
